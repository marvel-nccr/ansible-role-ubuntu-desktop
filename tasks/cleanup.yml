- name: Run apt-get clean
  become: true
  ansible.builtin.apt:
    clean: true

- name: Wipe apt lists
  become: true
  ansible.builtin.file:
    state: absent
    path: /var/lib/apt/lists/

- name: Wipe vm user cache
  become: true
  become_user: "{{ ubuntu_desktop_vm_user }}"
  ansible.builtin.file:
    state: absent
    path: "~/.cache"

- name: Wipe root user cache
  become: true
  ansible.builtin.file:
    state: absent
    path: "~/.cache"
